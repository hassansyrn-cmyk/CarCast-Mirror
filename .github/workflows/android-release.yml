name: Android Signed Play Beta
on:
  workflow_dispatch:

  push:
    branches:
      - release/play-beta
    paths:
      - .github/workflows/android-release.yml
      - app/build.gradle.kts

permissions:
  contents: read

env:
  JAVA_VERSION: '17'

jobs:
  signed-release:
    name: Build signed Play beta AAB
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: play-release
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;35.0.0'
          accept-android-sdk-licenses: true

      - name: Restore protected upload keystore
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.CARCAST_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_BASE64"
          umask 077
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/carcast-upload.jks"
          test -s "$RUNNER_TEMP/carcast-upload.jks"

      - name: Validate protected upload signing material
        env:
          SIGNING_STORE: ${{ runner.temp }}/carcast-upload.jks
          SIGNING_STORE_PASSWORD: ${{ secrets.CARCAST_KEYSTORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.CARCAST_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.CARCAST_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          check_dir="$RUNNER_TEMP/carcast-signing-check"
          mkdir -m 700 "$check_dir"
          trap 'rm -rf "$check_dir"' EXIT
          printf '%s\n' 'CarCast signing preflight' > "$check_dir/input.txt"
          jar --create --file "$check_dir/check.jar" -C "$check_dir" input.txt
          jarsigner -keystore "$SIGNING_STORE" -storepass "$SIGNING_STORE_PASSWORD" -keypass "$SIGNING_KEY_PASSWORD" "$check_dir/check.jar" "$SIGNING_KEY_ALIAS" >/dev/null
          jarsigner -verify "$check_dir/check.jar" >/dev/null

      - name: Build signed release bundle
        env:
          CARCAST_KEYSTORE_PATH: ${{ runner.temp }}/carcast-upload.jks
          CARCAST_KEYSTORE_PASSWORD: ${{ secrets.CARCAST_KEYSTORE_PASSWORD }}
          CARCAST_KEY_ALIAS: ${{ secrets.CARCAST_KEY_ALIAS }}
          CARCAST_KEY_PASSWORD: ${{ secrets.CARCAST_KEY_PASSWORD }}
          CARCAST_ADMOB_APP_ID: ${{ secrets.CARCAST_ADMOB_APP_ID }}
          CARCAST_ADMOB_BANNER_AD_UNIT_ID: ${{ secrets.CARCAST_ADMOB_BANNER_AD_UNIT_ID }}
        run: |
          set -euo pipefail
          test -n "$CARCAST_KEYSTORE_PASSWORD"
          test -n "$CARCAST_KEY_ALIAS"
          test -n "$CARCAST_KEY_PASSWORD"
          test -n "$CARCAST_ADMOB_APP_ID"
          test -n "$CARCAST_ADMOB_BANNER_AD_UNIT_ID"
          ./gradlew clean testDebugUnitTest bundleRelease --no-daemon --stacktrace

      - name: Verify signed bundle
        run: |
          set -euo pipefail
          jarsigner -verify -verbose -certs app/build/outputs/bundle/release/app-release.aab >/dev/null
          sha256sum app/build/outputs/bundle/release/app-release.aab

      - name: Upload signed AAB to protected workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: CarCastMirror-${{ github.ref_name }}-signed-aab
          path: app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 7

      - name: Remove temporary keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/carcast-upload.jks"

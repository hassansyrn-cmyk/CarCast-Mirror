name: Android Debug APK

on:
  push:
    branches: [ main, 'ui/**', 'stability/**' ]
  pull_request:
    branches: [ main, 'ui/**', 'stability/**' ]
  workflow_dispatch:

permissions:
  contents: read
  actions: write

env:
  JAVA_VERSION: '17'

jobs:
  build-debug:
    name: Test and build debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;35.0.0'
          accept-android-sdk-licenses: true

      - name: Build and test debug variant
        run: ./gradlew clean testDebugUnitTest assembleDebug --no-daemon --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: CarCastMirror-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
